# Festival and holiday dates used by the SYNTHETIC calendar.
# WARNING: these dates must be verified (e.g. against official gazette / panchang)
# before any claim is made from them. Some festivals have regional date variations.

# Single-day festivals, by exact date.
# 2023-2025 dates came from the project brief. 2026-2029 were added in Task 5b (horizon
# extension) from memory and are UNVERIFIED APPROXIMATIONS: check against a panchang first.
festivals:
  Holi: ["2023-03-08", "2024-03-25", "2025-03-14", "2026-03-04", "2027-03-22", "2028-03-11", "2029-03-01"]
  Dussehra: ["2023-10-24", "2024-10-12", "2025-10-02", "2026-10-20", "2027-10-09", "2028-09-27", "2029-10-16"]
  Diwali: ["2023-11-12", "2024-11-01", "2025-10-20", "2026-11-08", "2027-10-29", "2028-10-17", "2029-11-05"]

# Festivals that span a recurring MM-DD range every year (may wrap past the new year).
# Every day in the range counts as a festival day.
recurring_festivals:
  - {name: "Christmas-New Year", start: "12-24", end: "01-01"}

# National public holidays, by MM-DD every year.
public_holidays:
  - {name: "Republic Day", month_day: "01-26"}
  - {name: "Independence Day", month_day: "08-15"}
  - {name: "Gandhi Jayanti", month_day: "10-02"}

# ASSUMED school holiday ranges (approximate, vary by state and board), MM-DD every year.
school_holidays:
  - {name: "Summer break", start: "05-20", end: "06-30"}
  - {name: "Winter break", start: "12-24", end: "01-05"}
