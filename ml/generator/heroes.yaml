# DEMO HEROES (Task T5): scripted, fictional employees for demos ONLY.
# They live in their own files (data/demo/), are never part of training or test data, and their
# display names are kept only in data/demo/hero_display_names.json. Every value is a scripted
# ASSUMPTION for the demo, not data. The script covers the LAST `weeks` simulated weeks.
# [a, b] means a straight line from a (first scripted week) to b (last scripted week).
# leave_weeks maps a 1-based scripted week to leave days taken that week.
# no_weekend_off_last_weeks: number of final weeks with no weekend off (others alternate).
weeks: 12

heroes:
  H901:
    display_name: Sunita
    story: overtime overload and clustered-leave burnout
    department: housekeeping
    role: attendant
    contract_type: permanent
    tenure_months: 26
    months_since_raise: 8
    pay_ratio: 0.97
    overtime_hours: [6, 18]
    pulse_score: [4.1, 2.6]
    task_score: [88, 79]
    no_weekend_off_last_weeks: 5
    leave_weeks: {4: 2}        # 2 days just before Diwali (2029-11-05), no other leave

