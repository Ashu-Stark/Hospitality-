[tool.pytest.ini_options]
# This folder IS the `ml` package, so its parent (the repo root) must be importable.
pythonpath = [".."]
testpaths = ["tests"]
markers = ["slow: calibration searches and full-pipeline runs (python run.py test --all)",
           "gpu: trains a model, so it needs CUDA (skipped without a GPU, never run on the CPU)"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Lets ruff's import sorting recognise `ml` (found at the repo root) as first-party.
src = [".."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
