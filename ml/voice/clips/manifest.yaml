# Voice clip manifest (Task T11). Each entry is a SCRIPTED line: the HM student (or a synthetic
# TTS voice) records it; no real guest or staff speech is ever used. Audio files go next to this
# manifest (ml/voice/clips/<file>). `source` must be synthetic or hm_student before any cloud
# provider may receive the clip. Expected fields are what the extractor should return.
# status: missing until the audio file exists.

demo_clip: clip_01.wav

clips:
