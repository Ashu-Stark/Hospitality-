[theme]
base = "light"
primaryColor = "#1f6fe5"
backgroundColor = "#f2f2f0"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"
font = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap"
baseRadius = "14px"

[client]
showSidebarNavigation = false
toolbarMode = "minimal"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
