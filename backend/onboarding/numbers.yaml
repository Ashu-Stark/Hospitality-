# Number words for the deterministic number normaliser (onboarding Part C): English, romanised
# Hindi (Hinglish) and Devanagari Hindi, 0-100, plus scale words, fractions and multipliers.
# DRAFT written by the developer: the HM (hotel management) student must review the Hindi
# spellings, add local variants, and set verified_by_hm_student: true. Matching is on whole
# words after lower-casing and Unicode NFC normalisation; Devanagari digits are read too.
# Spellings that are also common ordinary words were left out on purpose (tera = "your",
# bara = "big", sath = "with"); see `ambiguous` for the ones kept with a context rule.
review:
  status: DRAFT
  needs_hm_review: true
  verified_by_hm_student: false

