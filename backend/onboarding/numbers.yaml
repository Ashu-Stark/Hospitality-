# Multiply the number before them ("do sau" = 200, "5 hazaar" = 5000, "ek sau bees" = 120).
scale_words:
  100: [hundred]          # sau / सौ are 100 above and also act as a scale
  1000: [thousand, hazaar, hazar, hajar, हज़ार, हजार]
  100000: [lakh, lac, लाख]

# Fractions read as one number (multi-word phrases allowed).
fractions:
  1.5: [dedh, derh, डेढ़, one and a half, one and half]
  2.5: [dhai, dhaai, ढाई, two and a half]

# Words meaning "N times" (overtime): rewritten to "<N> guna".
multipliers:
  1.5: [time and a half]
  2: [double, dugna, doguna, dogna, दोगुना, दुगना, दुगुना]
  3: [triple, tiguna, तिगुना]

# Number words that are also common ordinary words: read as a number unless the word right
# before is in not_after or the word right after is in not_before.
ambiguous:
  do: {not_after: [to, i, we, you, they, will, can, not, "don't"], not_before: [you, we, not, the, i, it, this, that]}
  saath: {not_after: [ke, ki, unke, mere, hamare], not_before: []}
  tin: {not_after: [a, the], not_before: []}
