# Hotel onboarding by voice: settings. Every value is ASSUMED (a design choice or a plausible
# placeholder, not a measured fact) and must be reviewed by the HM (hotel management) student.
# All demo and test data is SYNTHETIC.
review:
  status: ASSUMED
  verified_by_hm_student: false

# Hotel type by number of rooms (inclusive bounds; max null = no upper bound). ASSUMED.
size_bands:
  homestay: {min: 5, max: 15}
  small_hotel: {min: 16, max: 50}
  resort: {min: 51, max: null}
default_hotel_type: small_hotel   # used for the first template when the type is not known yet

# Allowed ranges per field (inclusive). Out of range = an error that blocks Confirm. ASSUMED.
ranges:
  rooms: {min: 1, max: 500}
  headcount_per_department: {min: 0, max: 200}
  shift_hours: {min: 4, max: 12}
  standard_weekly_hours: {min: 20, max: 72}
  weekly_off_days: {min: 0, max: 3}
  min_rest_hours: {min: 6, max: 16}
  max_consecutive_days: {min: 1, max: 13}
  overtime_rate_multiplier: {min: 1.0, max: 3.0}
  incentive_monthly_budget_cap: {min: 0, max: 10000000}

# Staff per room: outside this range = a warning only (it never blocks Confirm). ASSUMED.
staff_to_room_ratio: {min: 0.3, max: 2.5}

# Question flow (Part B)
max_questions: 8
max_asks_per_field: 2      # a field with no usable answer is asked again once, then left to the
                           # template; the owner can still edit it in the draft table
# Fields asked, in this fixed order (brief). Every other field comes from the template and is
# shown at confirm time instead of being asked.
required_order: [rooms, location, departments, peak_months, shifts, overtime_rate_multiplier,
                 min_rest_hours]

# Confidence per way a value was produced (0-1). ASSUMED.
confidence:
  template: 0.5          # brief: template values are a guess
  rules_pattern: 0.8     # rule-based extractor, value next to its keyword ("12 rooms")
  rules_context: 0.7     # rule-based extractor, a bare value read from the question asked
  rules_free_text: 0.6   # rule-based extractor, free text (location not in the place list)
  llm_checked: 0.9       # LLM value whose numbers match the number normaliser
  llm_unchecked: 0.75    # LLM value with no number to check (location, months, type)
  mismatch: 0.3          # brief: LLM number differs from the normaliser -> "please confirm"
  edit: 1.0              # the owner typed it into the draft table
  accept_threshold: 0.6  # below this an answer is never accepted without the owner's check

# Rule-based extractor (Part C). ASSUMED.
extraction:
  headcount_window_words: 4      # a headcount must be within this many words of its department
  shift_name_by_start_hour:      # a shift without a name is named by its start hour (24 h)
    morning: [4, 11]
    afternoon: [12, 15]
    evening: [16, 20]
    night: [21, 3]               # wraps past midnight
  pm_shift_names: [afternoon, evening, night]   # "shaam 3 se 11" = 15:00-23:00
  earliest_unnamed_am_hour: 5    # an unnamed shift starting before this hour is read as pm

# LLM extractor (Part C): Groq's OpenAI-compatible chat completions, standard library only.
# The key is read ONLY from the environment variable below, never from a file in the repo.
# The API sends an owner's answer to the LLM only if allow_cloud_llm_for_owner_text is true AND
# the request carries consent=true; otherwise the rule-based extractor runs (no network).
# Free AI tiers give no privacy guarantee: never send real names, salaries or staff data.
llm:
  enabled: true
  api_key_env: GROQ_API_KEY
  url: "https://api.groq.com/openai/v1/chat/completions"   # VERIFY against Groq docs
  model: "openai/gpt-oss-20b"     # ASSUMED (available on the team key); alternative:
                                  # "qwen/qwen3.8-27b"
  temperature: 0
  json_mode: true                 # response_format {"type": "json_object"}; still validated
  reasoning_effort: low           # gpt-oss models only; null to leave it out
  max_tokens: 1500
  timeout_seconds: 30
  max_retries_on_rate_limit: 4    # HTTP 429 (free tier: ~8000 tokens per minute)
  retry_wait_seconds: 10          # when the reply has no Retry-After header
  retry_wait_max_seconds: 30
  allow_cloud_llm_for_owner_text: false   # ASSUMED default: owner answers stay local

# Owner audio (Part D). Cloud speech-to-text (ml/voice adapters: Groq Whisper, Sarvam) runs on an
# owner's recording ONLY if allow_cloud_stt_for_owner_audio is true AND the request carries
# consent=true (checkbox: own voice, no staff names or salaries, free AI tiers give no privacy
# guarantee). Otherwise the answer endpoint says so and asks for typed text. Audio is never
# stored after transcription unless store_audio is true (temp files are deleted in `finally`).
audio:
  allow_cloud_stt_for_owner_audio: false    # ASSUMED default: off
  store_audio: false                        # ASSUMED default: off
  audio_dir: backend/onboarding/audio       # only used when store_audio is true (gitignored)
  max_megabytes: 10
  allowed_types: [audio/wav, audio/x-wav, audio/wave, audio/vnd.wave, audio/mpeg, audio/mp3,
                  audio/mp4, audio/x-m4a, audio/m4a, audio/webm, audio/ogg]
  allowed_extensions: [.wav, .mp3, .m4a, .mp4, .webm, .ogg]
  stt_providers: [groq, sarvam]             # names from ml/voice/config.yaml, tried in order

# Demo properties (Part F), created through the template path by /demo/reset. SYNTHETIC.
demo_properties:
  - {hotel_name: "Demo Pine Homestay (SYNTHETIC)", hotel_type: homestay, rooms: 12, location: Mussoorie}
  - {hotel_name: "Demo Ridge Hotel (SYNTHETIC)", hotel_type: small_hotel, rooms: 35, location: Nainital}
  - {hotel_name: "Demo Valley Resort (SYNTHETIC)", hotel_type: resort, rooms: 80, location: Rishikesh}
