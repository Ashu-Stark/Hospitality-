# Render Blueprint (Infrastructure as Code) for the Hospitality Operations Intelligence (HOI)
# backend. ALL data is SYNTHETIC. Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hoi-backend
    runtime: docker                       # current key; older Blueprints used `env: docker`
    plan: free                            # free web services support Docker (0.1 CPU, 512 MB)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .                      # repo root: the image needs backend/ and ml/
    healthCheckPath: /health
    envVars:
      - key: MOCK                         # "1" serves ml/data/mocks/*.json instead of the models
        value: "0"
      - key: CORS_ORIGINS                 # comma-separated allowed origins; "*" = all (demo)
        value: "*"
      - key: HOI_OPS_API_KEY              # secret: callers must send it as X-HOI-Key (all but /health); same value on both dashboards
        sync: false
      - key: MONGODB_URI                  # secret: Atlas connection string, set in the dashboard
        sync: false
      - key: HOI_OPS_DB                   # MongoDB database of this service
        value: hoi_ops
      - key: GROQ_API_KEY                 # optional: voice transcription (Groq Whisper)
        sync: false
      - key: GROQ_API_KEYS_BACKUP          # secret, optional: comma-separated backup Groq keys, used only when a key is invalid/revoked or Groq fails (never on 429)
        sync: false
      - key: SARVAM_API_KEY               # optional: voice transcription (Sarvam)
        sync: false
      # PORT is injected by Render; backend.serve binds 0.0.0.0:$PORT.

  # HOI platform API + staff phone app (/worker/) + guest QR pages (/guest/).
  - type: web
    name: hoi-platform-api
    runtime: docker
    plan: free
    dockerfilePath: ./platform_api/Dockerfile
    dockerContext: ./platform_api
    healthCheckPath: /ready                # pings MongoDB
    envVars:
      - key: MONGODB_URI                   # secret: Atlas connection string
        sync: false
      - key: HOI_PLATFORM_DB
        value: hoi_platform
      - key: OPS_API_URL                   # the ML / ops backend the demo tenant's dashboard calls (use_mocks false)
        value: https://hoi-ops.onrender.com
      - key: HOI_JWT_SECRET                # must be fixed, or sign-ins break on every restart
        generateValue: true
      - key: HOI_ENV                       # "production" refuses demo logins; keep development for the hackathon demo
        value: development
      - key: HOI_DEMO_LOGIN
        value: "true"
      - key: HOI_PUBLIC_BASE_URL           # this service's public URL (printed into room QR codes), e.g. https://hoi-platform-api.onrender.com
        sync: false
      - key: HOI_CORS_ORIGINS
        value: "*"
      - key: GROQ_API_KEY                  # secret: guest concierge + worker voice (Whisper STT, chat LLM); without it the rule-based fallback runs
        sync: false
      - key: SARVAM_API_KEY                # secret, optional: realistic Indian voices for spoken replies (also set TTS_PROVIDER=sarvam); without it the browser voice speaks
        sync: false

  # Streamlit HOTEL ADMIN portal (owners, HR, department heads, storekeepers, employees; platform admins choose a hotel,
  # audited). Name kept as hoi-dashboard so the live service and its URL do not change. Calls the two APIs above.
  - type: web
    name: hoi-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    healthCheckPath: /_stcore/health
    envVars:
      - key: ADMIN_PORTAL                  # hotel admin portal (no platform console pages)
        value: hotel
      - key: SUPER_PORTAL_URL              # hoi-platform-admin public URL, e.g. https://hoi-platform-admin.onrender.com
        sync: false
      - key: USE_MOCKS                     # the image defaults to mock data; use the live APIs
        value: "false"
      - key: API_BASE_URL                  # hoi-backend public URL, e.g. https://hoi-backend.onrender.com
        sync: false
      - key: PLATFORM_API_URL              # hoi-platform-api public URL
        sync: false
      - key: HOI_OPS_API_KEY               # secret: the same value as on the ops API, sent as X-HOI-Key
        sync: false
      - key: PLATFORM_PUBLIC_URL           # same URL; shown to staff phones and in QR links
        sync: false

  # Streamlit SUPER-ADMIN portal (HOI team only): hotels, plans/modules, insights, audit log. Same image as above;
  # hotel accounts are refused here and pointed to the hotel portal.
  - type: web
    name: hoi-platform-admin
    runtime: docker
    plan: free
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    healthCheckPath: /_stcore/health
    envVars:
      - key: ADMIN_PORTAL                  # platform console only
        value: super
      - key: HOTEL_PORTAL_URL              # hoi-dashboard public URL ("Open in hotel portal" links), e.g. https://hoi-dashboard.onrender.com
        sync: false
      - key: USE_MOCKS
        value: "false"
      - key: API_BASE_URL                  # hoi-backend public URL
        sync: false
      - key: PLATFORM_API_URL              # hoi-platform-api public URL
        sync: false
      - key: HOI_OPS_API_KEY               # secret: the same value as on the ops API, sent as X-HOI-Key
        sync: false
      - key: PLATFORM_PUBLIC_URL           # same URL
        sync: false
